name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:server
      - run: npm run build
      - name: Size budgets
        run: node scripts/check-budgets.mjs

  e2e:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Firefox and WebKit run without blocking until they have been green for a while.
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      E2E_BROWSER: ${{ matrix.browser }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      # Headless Firefox has no WebGL on Linux; run it headed on a virtual display instead.
      E2E_HEADED: ${{ matrix.browser == 'firefox' && '1' || '' }}
      RUN: ${{ matrix.browser == 'firefox' && 'xvfb-run -a' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # With Bun the dev server starts the file server, so the tests save projects to disk.
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Install ${{ matrix.browser }} for Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # Headless Firefox needs a GL driver for WebGL; the runner has no GPU, so use Mesa's software one.
      - name: Software OpenGL (Mesa) for Firefox
        if: matrix.browser == 'firefox'
        run: sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libegl1
      - name: Smoke test (editor, play, context loss, draw-call budget)
        run: $RUN npm run test:e2e
      - name: Export test (every template exported and played)
        run: $RUN npm run test:exports
      - name: Upload screenshots and exported games
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
